<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4226"/><stop offset=".5" stop-color="#4a2c19"/><stop offset="1" stop-color="#2e1b0f"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4c9"/><stop offset=".45" stop-color="#f6cd63"/><stop offset="1" stop-color="#c58a22"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d49a2c"/><stop offset="1" stop-color="#8a5a12"/>
    </linearGradient>
    <radialGradient id="pip" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#6a1414"/><stop offset="1" stop-color="#1e0505"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#wood)"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#f2c14e" stroke-opacity=".35" stroke-width="6" stroke-dasharray="18 12"/>
  <!-- isometric die -->
  <path d="M256 96 L408 172 L256 248 L104 172 Z" fill="url(#top)"/>
  <path d="M104 172 L256 248 L256 420 L104 344 Z" fill="url(#side)"/>
  <path d="M408 172 L256 248 L256 420 L408 344 Z" fill="#a8721a"/>
  <path d="M256 96 L408 172 L256 248 L104 172 Z" fill="none" stroke="#fff8dc" stroke-opacity=".6" stroke-width="4"/>
  <!-- pips: top face shows 1, left 2, right 3 -->
  <ellipse cx="256" cy="172" rx="26" ry="14" fill="url(#pip)"/>
  <ellipse cx="146" cy="235" rx="15" ry="20" fill="url(#pip)"/>
  <ellipse cx="214" cy="335" rx="15" ry="20" fill="url(#pip)"/>
  <ellipse cx="298" cy="335" rx="15" ry="20" fill="url(#pip)" opacity=".9"/>
  <ellipse cx="332" cy="296" rx="15" ry="20" fill="url(#pip)" opacity=".9"/>
  <ellipse cx="366" cy="257" rx="15" ry="20" fill="url(#pip)" opacity=".9"/>
</svg>
