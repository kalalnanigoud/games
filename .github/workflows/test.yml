# Runs on every push and pull request, so a broken change is caught before it reaches the live site.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: Rules, platform and simulated games
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26, which the headless browser may not support yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Command-line checks
        run: node tools/test.mjs 20
        env:
          CI: 'true'

  browser:
    name: Rendering at phone and desktop sizes
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26, which the headless browser may not support yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install a headless browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Browser checks
        run: node tools/browser-ci.mjs
      - name: Multiplayer and WebKit touch checks
        run: node tools/multiplayer-ci.mjs
      - name: Creature Island with four live players
        run: node tools/island-ci.mjs
      - name: Upload browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
