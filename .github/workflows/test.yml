# Runs on every push and pull request, so a broken change is caught before it reaches the live site.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: Rules, platform and simulated games
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26, which the headless browser may not support yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Command-line checks
        run: node tools/test.mjs 20
        env:
          CI: 'true'

  browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Report every suite even when another parallel job fails.
      fail-fast: false
      matrix:
        include:
          - suite: browser-ci
            name: Game rendering (phone and desktop)
            browsers: chromium
          - suite: multiplayer-ci
            name: Multiplayer and touch
            browsers: chromium webkit
          - suite: island-ci
            name: Island (four live players)
            browsers: chromium webkit
          - suite: rally-ci
            name: Pocket Rally
            browsers: chromium webkit
          - suite: arena-ci
            name: Arena Rush
            browsers: chromium
          - suite: onboarding-ci
            name: Onboarding and controls
            browsers: chromium webkit
          - suite: fx-toggle
            name: Lower effects toggle
            browsers: chromium
          - suite: startup-ci
            name: Startup and storage resilience
            browsers: chromium webkit
          - suite: island-faults
            name: Island save and failure recovery
            browsers: chromium webkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Run browser suite
        run: node tools/test-all.mjs --only ${{ matrix.suite }}
      - name: Upload browser logs, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 7

  performance:
    name: Creature Island performance (phone budget)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26, which the headless browser may not support yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install a headless browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Frame time, memory and network under 4x CPU throttling
        run: node tools/perf-island.mjs --effects both
        env:
          # The target is 40 ms (the default). Headless Chromium has no GPU, so the measured p95 is far above
          # it today; this is a regression guard. Lower it as the island gets faster.
          PERF_BUDGET_MS: '2500'
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: island-performance
          path: |
            test-results/perf-island.json
            test-results/perf-island.md
          retention-days: 30
      - name: Show the summary
        if: always()
        run: cat test-results/perf-island.md >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rules, browser, performance]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
