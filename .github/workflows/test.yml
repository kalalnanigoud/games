# Runs on every push and pull request, so a broken change is caught before it reaches the live site.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: Rules, platform and simulated games
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26, which the headless browser may not support yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Command-line checks
        run: node tools/test.mjs 20
        env:
          CI: 'true'

  browser:
    name: Rendering at phone and desktop sizes
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26, which the headless browser may not support yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install a headless browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Browser checks
        run: node tools/browser-ci.mjs
      - name: Multiplayer and WebKit touch checks
        if: !cancelled()
        run: node tools/multiplayer-ci.mjs
      - name: Creature Island with four live players
        if: !cancelled()
        run: node tools/island-ci.mjs
      - name: Pocket Rally
        if: !cancelled()
        run: node tools/rally-ci.mjs
      - name: Arena Rush
        if: !cancelled()
        run: node tools/arena-ci.mjs
      - name: Onboarding, controls and practice
        if: !cancelled()
        run: node tools/onboarding-ci.mjs
      - name: Lower effects toggle
        if: !cancelled()
        run: node tools/fx-toggle-shot.mjs
      - name: Startup, storage fallback, and CDN resilience
        if: !cancelled()
        run: node tools/startup-ci.mjs
      - name: Creature Island fault injection (Chromium and WebKit)
        if: !cancelled()
        run: node tools/island-faults.mjs
      - name: Upload browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          retention-days: 7

  performance:
    name: Creature Island performance (phone budget)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26, which the headless browser may not support yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install a headless browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Frame time, memory and network under 4x CPU throttling
        run: node tools/perf-island.mjs --effects both
        env:
          # The target is 40 ms (the default). Headless Chromium has no GPU, so the measured p95 is far above
          # it today; this is a regression guard. Lower it as the island gets faster.
          PERF_BUDGET_MS: '2500'
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-performance
          path: |
            test-results/perf-island.json
            test-results/perf-island.md
          retention-days: 30
      - name: Show the summary
        if: always()
        run: cat test-results/perf-island.md >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rules, browser, performance]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
